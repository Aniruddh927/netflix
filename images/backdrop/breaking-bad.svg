  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2e1b"/><stop offset="0.5" stop-color="#3c541d"/><stop offset="1" stop-color="#5c7a1f"/>
