<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Jurassic Park backdrop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14290f"/><stop offset="0.5" stop-color="#294a1f"/><stop offset="1" stop-color="#3d6b2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
