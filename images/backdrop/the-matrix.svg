  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2b1c"/><stop offset="0.5" stop-color="#155c33"/><stop offset="1" stop-color="#1f8c4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.18" r="0.85">
