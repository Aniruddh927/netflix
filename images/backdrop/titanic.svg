    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a2b"/><stop offset="0.5" stop-color="#2b4a65"/><stop offset="1" stop-color="#4a7a9e"/>
