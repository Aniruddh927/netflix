  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c3e50"/><stop offset="0.5" stop-color="#3c7080"/><stop offset="1" stop-color="#4ca1af"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.18" r="0.85">
